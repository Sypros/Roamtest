name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android app
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build laptop server and Termux tool
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/RoamTest.apk
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o out/RoamTest-Server-Windows.exe ./server
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o out/RoamTest-Server-Mac ./server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o out/roamtest-termux ./cli

      - name: Publish as the 'latest' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --title "RoamTest build ${{ github.run_number }}" \
            --notes "Phone: install RoamTest.apk. Laptop: run RoamTest-Server-Windows.exe. Built from ${{ github.sha }}."

      - uses: actions/upload-artifact@v4
        with:
          name: roamtest
          path: out/
